<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="carbon-trace — an immersive visual narrative" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self'; media-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'none'; object-src 'none'; base-uri 'self'"
    />
    <title>carbon-trace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" role="application" aria-label="carbon-trace visual narrative">
      <div
        class="loading-screen"
        id="loading-screen"
        role="status"
        aria-label="Loading carbon-trace"
      >
        <div class="loading-trace">
          <svg class="loading-svg" viewBox="0 0 200 40" aria-hidden="true">
            <path
              class="trace-glow"
              d="M 10,20 H 55 L 59,12 L 63,20 H 100 L 104,28 L 108,20 H 140 L 144,12 L 148,20 H 190"
            />
            <path
              class="trace-path"
              d="M 10,20 H 55 L 59,12 L 63,20 H 100 L 104,28 L 108,20 H 140 L 144,12 L 148,20 H 190"
            />
            <circle class="trace-node" cx="100" cy="20" r="2" />
          </svg>
          <p class="loading-title">carbon-trace</p>
        </div>
      </div>

      <div class="scene-stage" id="scene-stage" hidden>
        <canvas class="scene-canvas" id="scene-canvas" aria-hidden="true"></canvas>
        <div class="trace-overlay" id="trace-overlay"></div>
        <canvas class="effects-canvas" id="effects-canvas" aria-hidden="true"></canvas>
        <div class="narration-layer" id="narration-layer" aria-hidden="true"></div>
        <div class="caption-layer" id="caption-layer" aria-hidden="true"></div>
      </div>

      <button class="play-gate" id="play-gate" hidden aria-label="Begin experience">
        <svg class="play-gate-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="32" cy="32" r="30" />
          <polygon points="26,18 26,46 48,32" />
        </svg>
        <span class="play-gate-label">click to begin</span>
      </button>

      <div class="transition-loader" id="transition-loader" hidden aria-hidden="true"></div>

      <div class="overlay-controls" id="overlay-controls" hidden>
        <nav class="progress-dots" id="progress-dots" aria-label="Scene progress"></nav>
        <div class="control-buttons">
          <button class="btn-prev" id="btn-prev" aria-label="Previous scene" disabled>
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button class="btn-pause" id="btn-pause" aria-label="Pause" aria-pressed="false">
            <svg
              class="icon-pause"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
            <svg
              class="icon-play"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </button>
          <button class="btn-mute" id="btn-mute" aria-label="Mute audio" aria-disabled="true">
            <svg
              class="icon-on"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            <svg
              class="icon-muted"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="23" y1="9" x2="17" y2="15" />
              <line x1="17" y1="9" x2="23" y2="15" />
            </svg>
          </button>
          <button class="btn-captions" id="btn-captions" aria-label="Captions" aria-pressed="false">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="M7 15h4" />
              <path d="M13 15h4" />
              <path d="M7 11h10" />
            </svg>
          </button>
          <button class="btn-replay" id="btn-replay" aria-label="Replay narration" disabled>
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M1 4v6h6" />
              <path d="M3.51 15a9 9 0 1 0 .49-3.51" />
            </svg>
          </button>
          <button class="btn-next" id="btn-next" aria-label="Next scene" disabled>
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sr-only" aria-live="polite" id="accessible-narration"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
