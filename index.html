<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="carbon-trace — an immersive visual narrative" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'"
    />
    <title>carbon-trace</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" role="application" aria-label="carbon-trace visual narrative">
      <div class="loading-screen" id="loading-screen">
        <p>Loading...</p>
      </div>

      <div class="scene-stage" id="scene-stage" hidden>
        <img class="scene-image" id="scene-image" alt="" />
        <div class="trace-overlay" id="trace-overlay"></div>
        <div class="effects-layer" id="effects-layer"></div>
        <div class="narration-layer" id="narration-layer"></div>
      </div>

      <div class="overlay-controls" id="overlay-controls" hidden>
        <div
          class="progress-dots"
          id="progress-dots"
          role="group"
          aria-label="Scene progress"
        ></div>
        <div class="control-buttons">
          <button class="btn-replay" id="btn-replay" aria-label="Replay narration" hidden>
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M1 4v6h6" />
              <path d="M3.51 15a9 9 0 1 0 .49-3.51" />
            </svg>
          </button>
          <button class="btn-mute" id="btn-mute" aria-label="Mute audio" disabled>
            <svg
              class="icon-on"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            <svg
              class="icon-muted"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="23" y1="9" x2="17" y2="15" />
              <line x1="17" y1="9" x2="23" y2="15" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sr-only" aria-live="polite" id="accessible-narration"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
