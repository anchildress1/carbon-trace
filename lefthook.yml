# lefthook.yml
pre-commit:
  parallel: false
  commands:
    format:
      run: make format
      stage_fixed: true
    lint:
      run: make lint
      stage_fixed: true
    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint -color
    scan-secrets:
      run: make secret-scan
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}

pre-push:
  commands:
    test:
      run: make test
