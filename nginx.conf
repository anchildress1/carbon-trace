server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers (applied globally, re-added in sub-locations that
    # use their own add_header directives since nginx does not inherit)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── /carbon-trace/ ──────────────────────────────────────────────────

    # Redirect bare path to trailing-slash canonical form
    location = /carbon-trace {
        return 301 /carbon-trace/;
    }

    # HTML entry point — no cache so deploys take effect immediately
    location = /carbon-trace/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /carbon-trace/index.html =404;
    }

    # Vite hashed assets — immutable 1-year cache
    location /carbon-trace/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Support range requests for audio streaming
        add_header Accept-Ranges "bytes" always;
    }

    # Favicon
    location = /carbon-trace/favicon.svg {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — any unmatched path under /carbon-trace/ serves index
    location /carbon-trace/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /carbon-trace/index.html;
    }

    # ── Infrastructure ──────────────────────────────────────────────────

    # Health check for Cloud Run
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain always;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    # Root redirect to the app
    location = / {
        return 301 /carbon-trace/;
    }
}
