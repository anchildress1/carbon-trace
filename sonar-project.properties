sonar.projectKey=anchildress1_carbon-trace
sonar.organization=anchildress1

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=src/main.js

sonar.exclusions=node_modules/**,dist/**,coverage/**,playwright-report/**,playwright-results/**,public/**

# Rule exclusions — centralized, no inline comments
sonar.issue.ignore.multicriteria=e1,e2

# S2245: Math.random() in effects.js is cosmetic particle animation, not cryptographic
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=**/effects.js

# Web:S6819: progress-dots uses role="group" intentionally — dots are non-interactive
# status indicators; no semantic element (fieldset/details/etc.) is appropriate here
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=index.html
